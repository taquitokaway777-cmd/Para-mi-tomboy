<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un detalle especial 💜</title>
  <meta name="description" content="Una sorpresa especial en negro y morado con flores amarillas y canción personalizada.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background Audio Element -->
  <audio id="bgAudio" src="cancion.mp3" preload="auto" loop></audio>

  <!-- Dynamic Petal Canvas Overlay -->
  <canvas id="petalCanvas"></canvas>

  <!-- Background Decorative Purple Glowing Orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>

  <main class="app-container">

    <!-- INITIAL CENTER BUTTON VIEW -->
    <div id="heroSection" class="hero-section">
      <div class="pulse-ring"></div>
      <div class="pulse-ring delay"></div>
      
      <button id="surpriseBtn" class="surprise-btn" aria-label="Abrir sorpresa">
        <span class="btn-sparkle top-left">✨</span>
        <span class="btn-sparkle bottom-right">✨</span>
        <div class="btn-content">
          <i class="fa-solid fa-heart btn-icon"></i>
          <span class="btn-text">Presiona aquí 💜</span>
        </div>
      </button>
      <p class="hero-subtitle">Tengo un detalle especial para ti</p>
    </div>

    <!-- REVEAL CONTENT SECTION (Hidden Initially) -->
    <div id="revealSection" class="reveal-section hidden">
      
      <!-- Yellow Flower Garden Display -->
      <div class="flower-container" id="flowerContainer">
        <!-- Animated SVGs injected via script -->
      </div>

      <!-- Glassmorphic Purple Romantic Card -->
      <div class="message-card glass-card">
        <div class="card-header">
          <span class="sparkle-icon">✨</span>
          <h1 id="mainTitle" class="romantic-title">Te amo</h1>
          <span class="sparkle-icon">✨</span>
        </div>

        <div class="divider">
          <div class="divider-line"></div>
          <i class="fa-solid fa-heart divider-heart"></i>
          <div class="divider-line"></div>
        </div>

        <!-- ======================================================================
             EDITA TU TEXTO AQUÍ (PÁRRAFO EDITABLE DIRECTAMENTE EN EL CÓDIGO)
             ====================================================================== -->
        <div class="text-wrapper">
          <p id="mainParagraph" class="romantic-paragraph">
            Hoy quise darte estas flores amarillas para recordarte lo especial que eres en mi vida. Gracias por iluminar cada uno de mis días con tu sonrisa, tu ternura y tu amor. ¡Eres la persona más maravillosa del mundo! 💜✨
          </p>
        </div>
        <!-- ====================================================================== -->

        <!-- CONTROL TOOLBAR -->
        <div class="card-controls">
          <button id="replayBtn" class="tool-btn highlight" title="Lluvia de flores de nuevo">
            <i class="fa-solid fa-rotate-right"></i> Flores 💛
          </button>

          <button id="musicToggleBtn" class="tool-btn" title="Reproducir o pausar la música">
            <i class="fa-solid fa-music"></i> <span id="musicText">Pausar Música</span>
          </button>
        </div>

      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>Hecho con 💜 y mucho amor</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
